networks:
  default:
    external: true
    name: qgis_devtools_postgis_net

services:
  niche-modelling_python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niche-modelling_python
    image: niche-modelling_python
    volumes:
      - ${PWD}:/workdir
    networks:
      - default
    ports:
      - "8888:8888"
    command: bash -c "cd /workdir && jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"
